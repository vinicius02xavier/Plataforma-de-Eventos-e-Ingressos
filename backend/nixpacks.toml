# Nixpacks configuration for the backend API
#
# Our build step (`npm run build`) compiles TypeScript into `dist/`.
# Defining an explicit [phases.build] step tells Nixpacks to treat its
# output as part of the final image, so the compiled `dist/server.js`
# is preserved automatically without needing to cherry-pick files via
# `onlyIncludeFiles` (which caused checksum failures on `node_modules`).

[phases.install]
cmds = ["npm install"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npx prisma generate && npx prisma db push && npm start"
